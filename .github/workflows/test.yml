name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci || npm install --no-audit --no-fund
      - name: syntax check
        run: for f in $(find src test -name '*.js' -o -name '*.mjs'); do node --check "$f"; done
      - name: unit and contract tests
        run: npm test
